
name: Casa Contabil - Supabase

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-testes
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}

    steps:

      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Instalar Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.39.2

      - name: Verificar versao instalada
        run: supabase --version

      - name: Verificar credenciais
        shell: bash
        run: |
          for var in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_PROJECT_ID; do
            if [ -z "${!var}" ]; then
              echo "::error::Credencial ausente: $var"
              exit 1
            fi
          done
          echo "Credenciais configuradas."

      - name: Conectar projeto de testes
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Conferir migracoes
        run: supabase db push --dry-run

      - name: Aplicar migracoes
        run: supabase db push

      - name: Conferir historico
        run: supabase migration list

      - name: Finalizar implantacao
        run: echo "Implantacao concluida com sucesso."
